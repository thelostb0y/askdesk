[project]
name = "askdesk"
version = "0.1.0"
description = "Internal AI platform: RAG-grounded multi-agent Q&A over a private corpus, exposed as an API + Python SDK, with a CI eval harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "litellm>=1.70",
    "langgraph>=0.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sentry-sdk[fastapi]>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Fully local embeddings (no vendor, no data egress): ASKDESK_EMBED_MODEL=local/<model>
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/askdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
