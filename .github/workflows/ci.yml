name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Unit + integration tests (offline, deterministic)
        run: uv run pytest
      - name: Eval gate — golden-set quality floors
        run: uv run python eval/run_eval.py
